name: statefile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the project state file
        uses: ./
        with:
          state-file: STATE.md
          max-age-days: '30'
          strict: 'true'
